services:
  - type: web
    name: frost-puno-api-v2
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r backend_fastapi/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend_fastapi
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_SUPABASE
        value: false
      # v2 experimental supervisado retirado; usa el mismo modelo no supervisado.
      - key: MODEL_PATH
        value: ml_pipeline/registry/frost_cluster_model.joblib
      - key: MODEL_METADATA_PATH
        value: ml_pipeline/registry/cluster_metadata.json
      - key: DISTRICT_CLUSTERS_PATH
        value: data/processed/district_clusters.csv
      - key: CORS_ORIGINS
        value: https://frost-puno.vercel.app,http://localhost:3000,http://127.0.0.1:5174,http://localhost:5174
