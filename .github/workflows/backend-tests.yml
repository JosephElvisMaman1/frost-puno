name: Backend Tests

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      ENABLE_SUPABASE: "false"
      PYTHONPATH: ${{ github.workspace }}/backend_fastapi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend_fastapi/requirements.txt
            backend_fastapi/requirements-dev.txt
            ml_pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_fastapi/requirements-dev.txt
          pip install -r ml_pipeline/requirements.txt

      - name: Run backend tests
        run: pytest backend_fastapi/tests -q
