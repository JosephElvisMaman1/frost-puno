name: Model Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      min_silhouette:
        description: "Minimum accepted silhouette score"
        required: false
        default: "0.35"

jobs:
  model-quality-gate:
    runs-on: ubuntu-latest
    env:
      MIN_SILHOUETTE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.min_silhouette || '0.35' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_pipeline/requirements.txt pytest

      - name: Evaluate cluster metadata quality (silhouette)
        run: >
          python -m ml_pipeline.registry.check_cluster_quality
          --metadata ml_pipeline/registry/cluster_metadata.json

      # Pruebas de funcionamiento del mantenimiento e IC: verifican artefactos del
      # reentrenamiento, hiperparámetros optimizados y que el gate BLOQUEA un modelo
      # degradado.
      - name: Maintenance & CI functional tests
        run: python -m pytest ml_pipeline/tests/test_maintenance_ci.py -v

      - name: Future active-model comparison
        run: |
          echo "Future step: download the currently active production cluster metadata,"
          echo "compare silhouette / Davies-Bouldin drift, then block deployment on regression."

